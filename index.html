<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Friend</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffd6e7, #ffeccf, #d8f3ff);
        overflow: hidden;
      }

      .container {
        width: 90%;
        max-width: 650px;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 28px;
        padding: 40px 30px;
        text-align: center;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        border: 4px solid #fff;
        position: relative;
      }

      h1 {
        font-size: 2.2rem;
        color: #ff4f87;
        margin-bottom: 18px;
      }
